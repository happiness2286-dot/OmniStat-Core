name: Daily XSMB Auto Update & Quant Engine

on:
  schedule:
    # 11:35 UTC = 18:35 Giờ Việt Nam (UTC+7) hàng ngày
    - cron: '35 11 * * *'
  workflow_dispatch: # Cho phép kích hoạt chạy bằng tay trên Điện thoại bất kỳ lúc nào

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run Auto Update & Quant Pipeline
        run: |
          python auto_update_and_push.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "Auto-update XSMB data & quant models via GitHub Actions" && git push)
